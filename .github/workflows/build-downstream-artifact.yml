name: Manual owner stable image

run-name: OpenClaw owner stable at ${{ inputs.expected_source_commit }}

on:
  workflow_dispatch:
    inputs:
      expected_source_commit:
        description: Exact approved upstream stable source commit
        required: true
        default: 0965053fe6b9341776df147a6934b7485c60b5ca
        type: string
      publish:
        description: Publish the verified OCI image to GHCR
        required: true
        default: false
        type: boolean

permissions: {}

concurrency:
  group: manual-owner-stable-${{ inputs.expected_source_commit }}
  cancel-in-progress: false

jobs:
  build:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    env:
      APPROVED_SOURCE_COMMIT: 0965053fe6b9341776df147a6934b7485c60b5ca
      APPROVED_SOURCE_TAG: v2026.8.2
      CANDIDATE_REPOSITORY: https://github.com/openclaw/openclaw.git
      EXPECTED_VERSION: 2026.8.2
      IMAGE_REPOSITORY: ghcr.io/ashleyhollis/openclaw
      OPENCLAW_EXTENSIONS: codex,discord,llama-cpp
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Resolve the signed upstream tag and fetch its exact commit
        id: source
        env:
          EXPECTED_SOURCE_COMMIT: ${{ inputs.expected_source_commit }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SOURCE_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          test "$EXPECTED_SOURCE_COMMIT" = "$APPROVED_SOURCE_COMMIT"

          tag_ref="$(curl --fail --silent --show-error \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/openclaw/openclaw/git/ref/tags/$APPROVED_SOURCE_TAG")"
          test "$(jq -r .object.type <<<"$tag_ref")" = tag
          tag_object="$(jq -r .object.sha <<<"$tag_ref")"
          [[ "$tag_object" =~ ^[a-f0-9]{40}$ ]]
          tag_metadata="$(curl --fail --silent --show-error \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/openclaw/openclaw/git/tags/$tag_object")"
          test "$(jq -r .verification.verified <<<"$tag_metadata")" = true
          test "$(jq -r .verification.reason <<<"$tag_metadata")" = valid
          test "$(jq -r .object.type <<<"$tag_metadata")" = commit
          test "$(jq -r .object.sha <<<"$tag_metadata")" = "$EXPECTED_SOURCE_COMMIT"
          tagged_commit="$(git ls-remote "$CANDIDATE_REPOSITORY" "refs/tags/$APPROVED_SOURCE_TAG^{}" | cut -f1)"
          test "$tagged_commit" = "$EXPECTED_SOURCE_COMMIT"

          git init --initial-branch=source candidate
          git -C candidate remote add origin "$CANDIDATE_REPOSITORY"
          git -C candidate fetch --depth=1 origin "refs/tags/$APPROVED_SOURCE_TAG:refs/tags/$APPROVED_SOURCE_TAG"
          git -C candidate checkout --detach "$EXPECTED_SOURCE_COMMIT"
          test "$(git -C candidate rev-parse HEAD)" = "$EXPECTED_SOURCE_COMMIT"
          test -z "$(git -C candidate status --porcelain)"
          test "$(node -p "require('./candidate/package.json').version")" = "$EXPECTED_VERSION"

          git -C candidate archive --format=tar.gz --prefix=openclaw/ \
            --output "$RUNNER_TEMP/openclaw-source.tar.gz" "$EXPECTED_SOURCE_COMMIT"
          source_digest="sha256:$(sha256sum "$RUNNER_TEMP/openclaw-source.tar.gz" | cut -d ' ' -f1)"
          commit_epoch="$(git -C candidate show -s --format=%ct "$EXPECTED_SOURCE_COMMIT")"
          [[ "$commit_epoch" =~ ^[0-9]+$ ]]
          build_timestamp="$(date -u -d "@$commit_epoch" +%Y-%m-%dT%H:%M:%SZ)"
          short_commit="${EXPECTED_SOURCE_COMMIT:0:8}"
          {
            printf 'source_digest=%s\n' "$source_digest"
            printf 'build_timestamp=%s\n' "$build_timestamp"
            printf 'image_tag=stable-%s-%s\n' "$EXPECTED_VERSION" "$short_commit"
            printf 'local_image=openclaw-owner-stable:%s-%s\n' "$EXPECTED_VERSION" "$short_commit"
            printf 'tag_object=%s\n' "$tag_object"
          } >> "$GITHUB_OUTPUT"

      - name: Fail-closed source secret scan
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GIT_DIR: ${{ github.workspace }}/candidate/.git
          GIT_WORK_TREE: ${{ github.workspace }}/candidate
          GITLEAKS_CONFIG: ${{ github.workspace }}/downstream/gitleaks-public-openclaw-v2026.8.2.toml
          GITLEAKS_ENABLE_SUMMARY: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24.15.0

      - name: Install without package lifecycle scripts
        working-directory: candidate
        run: |
          set -euo pipefail
          corepack enable
          corepack pnpm install --frozen-lockfile --ignore-scripts

      - name: Run migration, memory, session, patch-supersession, Control UI, and protocol checks
        working-directory: candidate
        run: |
          set -euo pipefail
          corepack pnpm test \
            src/infra/sqlite-schema-contract.test.ts \
            src/commands/doctor-state-migrations.test.ts \
            src/commands/doctor-agent-memory-schema.test.ts \
            src/commands/doctor-memory-search.test.ts \
            src/agents/memory-search.test.ts \
            src/agents/openclaw-tools.sessions-visibility.test.ts \
            src/agents/cli-output-error.test.ts \
            src/agents/cli-output-events.test.ts \
            src/agents/cli-output-framing.test.ts \
            src/agents/cli-output-jsonl.test.ts \
            src/agents/cli-output-records.test.ts \
            src/agents/cli-output-stream.test.ts \
            src/agents/embedded-agent-runner/run/attempt.spawn-workspace.context-engine.test.ts \
            src/commands/channels.status.command-flow.test.ts \
            src/commands/channels.status.external-env.test.ts \
            src/commands/doctor/shared/missing-configured-plugin-install.test.ts \
            extensions/codex/index.test.ts \
            test/scripts/generate-npm-package-lock.test.ts \
            packages/gateway-protocol/src/schema/sessions-create.test.ts \
            packages/gateway-protocol/src/exec-approvals-validators.test.ts
          corepack pnpm --dir ui exec vitest run \
            src/api/gateway-browser-socket.test.ts \
            src/components/login-gate.test.ts \
            src/components/exec-approval.test.ts \
            src/components/terminal/terminal-file-upload.test.ts

      - name: Prepare the source-matched plugin runtime recipe
        id: packaging
        run: |
          set -euo pipefail
          node downstream/scripts/render-stable-runtime-dockerfile.mjs \
            candidate/Dockerfile "$RUNNER_TEMP/Dockerfile.stable-runtime"
          grep -F 'FROM upstream-runtime AS production' "$RUNNER_TEMP/Dockerfile.stable-runtime"
          grep -F '/opt/openclaw-plugin-runtime' "$RUNNER_TEMP/Dockerfile.stable-runtime"
          printf 'recipe_digest=sha256:%s\n' "$(sha256sum "$RUNNER_TEMP/Dockerfile.stable-runtime" | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - name: Build the clean upstream OCI image with source-matched plugin runtimes
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: candidate
          file: ${{ runner.temp }}/Dockerfile.stable-runtime
          platforms: linux/amd64
          outputs: type=oci,dest=${{ runner.temp }}/openclaw-stable.oci.tar
          sbom: true
          provenance: mode=max
          build-args: |
            GIT_COMMIT=${{ env.APPROVED_SOURCE_COMMIT }}
            OPENCLAW_BUILD_TIMESTAMP=${{ steps.source.outputs.build_timestamp }}
            OPENCLAW_EXTENSIONS=${{ env.OPENCLAW_EXTENSIONS }}
            OPENCLAW_INSTALL_BROWSER=1
            OPENCLAW_VERSION=${{ env.EXPECTED_VERSION }}

      - name: Load the exact OCI image for local checks
        env:
          LOCAL_IMAGE: ${{ steps.source.outputs.local_image }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install --yes --no-install-recommends skopeo
          skopeo copy "oci-archive:$RUNNER_TEMP/openclaw-stable.oci.tar" "docker-daemon:$LOCAL_IMAGE"

      - name: Network-disabled production image smoke
        env:
          LOCAL_IMAGE: ${{ steps.source.outputs.local_image }}
        run: |
          set -euo pipefail
          docker run --rm --network none \
            --env EXPECTED_VERSION="$EXPECTED_VERSION" \
            --entrypoint sh "$LOCAL_IMAGE" -lc '
              set -eu
              test "$(node -p "require(\"/app/package.json\").version")" = "$EXPECTED_VERSION"
              openclaw --version | grep -F "$EXPECTED_VERSION"
              ! command -v qmd
              test ! -e /opt/qmd-runtime
              test -d /opt/openclaw-plugin-runtime
              codex_root=/opt/openclaw-plugin-runtime/node_modules/@openclaw/codex/node_modules/@openai/codex
              codex_bin="$(node -e "const path=require(\"node:path\");const manifest=require(\"$codex_root/package.json\");const entry=typeof manifest.bin===\"string\"?manifest.bin:manifest.bin.codex;process.stdout.write(path.join(\"$codex_root\",entry))")"
              test -f "$codex_bin"
              node "$codex_bin" --version | grep -F "0.151.0"
              browser_path="$(node -e "const { chromium } = require(\"playwright-core\"); process.stdout.write(chromium.executablePath())")"
              test -n "$browser_path"
              test -x "$browser_path"
              for plugin in codex discord llama-cpp; do
                test -f "/app/extensions/$plugin/package.json"
                test -f "/app/extensions/$plugin/index.ts"
                test "$(node -p "require(\"/app/extensions/$plugin/package.json\").version")" = "$EXPECTED_VERSION"
              done
              state="$(mktemp -d)"
              trap "rm -rf \"$state\"" EXIT
              mkdir -p "$state/home" "$state/npm"
              cp -a /opt/openclaw-plugin-runtime/. "$state/npm/"
              node - "$state/openclaw.json" <<"NODE"
          const fs = require("node:fs");
          fs.writeFileSync(process.argv[2], `${JSON.stringify({
            plugins: {
              allow: ["codex", "discord", "llama-cpp"],
              entries: {
                codex: { enabled: true },
                discord: { enabled: true },
                "llama-cpp": { enabled: true },
              },
            },
          })}\n`, { mode: 0o600 });
          NODE
              HOME="$state/home" OPENCLAW_STATE_DIR="$state" OPENCLAW_SKIP_CHANNELS=1 OPENCLAW_SKIP_CRON=1 \
                openclaw plugins list --enabled --json > "$state/plugins.json"
              node - "$state/plugins.json" "$state/npm" <<"NODE"
          const fs = require("node:fs");
          const path = require("node:path");
          const { createRequire } = require("node:module");
          const plugins = JSON.parse(fs.readFileSync(process.argv[2], "utf8")).plugins ?? [];
          for (const id of ["codex", "discord", "llama-cpp"]) {
            const plugin = plugins.find((entry) => entry.id === id);
            if (!plugin) throw new Error(`missing ${id} plugin`);
            if (plugin.status !== "loaded" || plugin.enabled !== true) {
              throw new Error(`${id} plugin is not enabled and loaded`);
            }
            if (plugin.dependencyStatus?.requiredInstalled !== true) {
              throw new Error(`${id} plugin runtime dependencies are incomplete`);
            }
          }

          function resolvedPackageVersion(pluginDir, packageName) {
            const requireFromPlugin = createRequire(
              `${process.argv[3]}/node_modules/${pluginDir}/package.json`,
            );
            let current = path.dirname(requireFromPlugin.resolve(packageName));
            while (current !== path.dirname(current)) {
              const manifest = path.join(current, "package.json");
              if (fs.existsSync(manifest)) {
                const parsed = JSON.parse(fs.readFileSync(manifest, "utf8"));
                if (parsed.name === packageName) return parsed.version;
              }
              current = path.dirname(current);
            }
            throw new Error(`could not resolve ${packageName} from ${pluginDir}`);
          }

          if (resolvedPackageVersion("@openclaw/codex", "@openai/codex") !== "0.151.0") {
            throw new Error("packaged Codex runtime is not 0.151.0");
          }
          for (const dependency of ["@discordjs/voice", "discord-api-types", "libopus-wasm"]) {
            resolvedPackageVersion("@openclaw/discord", dependency);
          }
          NODE
            '

      - name: Scan fixable critical vulnerabilities
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ${{ steps.source.outputs.local_image }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL
          scanners: vuln

      - name: Publish the already-verified OCI image
        id: publish
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_TAG: ${{ steps.source.outputs.image_tag }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | skopeo login ghcr.io \
            --username "${{ github.repository_owner }}" --password-stdin
          destination="$IMAGE_REPOSITORY:$IMAGE_TAG"
          skopeo copy --all "oci-archive:$RUNNER_TEMP/openclaw-stable.oci.tar" "docker://$destination"
          digest="$(skopeo inspect "docker://$destination" --format '{{.Digest}}')"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          printf 'digest=%s\nimage=%s@%s\n' "$digest" "$IMAGE_REPOSITORY" "$digest" >> "$GITHUB_OUTPUT"

      - name: Record immutable stable image evidence
        if: inputs.publish
        env:
          IMAGE: ${{ steps.publish.outputs.image }}
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
          PACKAGING_RECIPE_DIGEST: ${{ steps.packaging.outputs.recipe_digest }}
          SOURCE_DIGEST: ${{ steps.source.outputs.source_digest }}
          TAG_OBJECT: ${{ steps.source.outputs.tag_object }}
        run: |
          set -euo pipefail
          node - "$RUNNER_TEMP/manual-stable-image.json" <<'NODE'
          const fs = require("node:fs");
          const evidence = {
            schemaVersion: 1,
            sourceTag: process.env.APPROVED_SOURCE_TAG,
            sourceTagObject: process.env.TAG_OBJECT,
            sourceTagSignatureVerified: true,
            sourceCommit: process.env.APPROVED_SOURCE_COMMIT,
            sourceBundleDigest: process.env.SOURCE_DIGEST,
            version: process.env.EXPECTED_VERSION,
            image: process.env.IMAGE,
            imageDigest: process.env.IMAGE_DIGEST,
            selectedPlugins: process.env.OPENCLAW_EXTENSIONS.split(","),
            sourceMatchedPluginRuntime: true,
            packagingRecipeDigest: process.env.PACKAGING_RECIPE_DIGEST,
            qmdIncluded: false,
            downstreamPatchesApplied: false,
            sbom: true,
            provenance: true,
            focusedChecks: [
              "global-and-agent-schema-contracts",
              "doctor-state-migrations",
              "local-memory-and-session-visibility",
              "downstream-patch-supersession-contracts",
              "control-ui-and-browser-socket",
              "gateway-protocol",
              "network-disabled-image-runtime",
              "critical-vulnerability-scan",
            ],
          };
          fs.writeFileSync(process.argv[2], `${JSON.stringify(evidence, null, 2)}\n`);
          NODE

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: inputs.publish
        with:
          name: manual-stable-image-${{ inputs.expected_source_commit }}
          path: ${{ runner.temp }}/manual-stable-image.json
          if-no-files-found: error
          retention-days: 90

      - name: Report immutable stable image
        if: inputs.publish
        env:
          IMAGE: ${{ steps.publish.outputs.image }}
          PACKAGING_RECIPE_DIGEST: ${{ steps.packaging.outputs.recipe_digest }}
          SOURCE_DIGEST: ${{ steps.source.outputs.source_digest }}
        run: |
          {
            echo '### Manual owner stable image'
            echo
            echo "- Signed source tag: \`$APPROVED_SOURCE_TAG\`"
            echo "- Source commit: \`$APPROVED_SOURCE_COMMIT\`"
            echo "- Source bundle: \`$SOURCE_DIGEST\`"
            echo "- Image: \`$IMAGE\`"
            echo "- Packaging recipe: \`$PACKAGING_RECIPE_DIGEST\`"
            echo '- Downstream patches: `none`'
            echo '- QMD runtime: `not included`'
          } >> "$GITHUB_STEP_SUMMARY"
