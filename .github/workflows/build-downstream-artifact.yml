# GitHub dispatches only workflow paths that also exist on the default branch.
# This personal branch replaces that path temporarily; main remains unchanged.
name: Manual owner beta image

run-name: OpenClaw owner beta at ${{ inputs.expected_source_commit }}

on:
  workflow_dispatch:
    inputs:
      expected_source_commit:
        description: Exact approved upstream source commit
        required: true
        default: 4d6bdbdbf33fe3ece3c53853fab9931882ff3f3c
        type: string
      publish:
        description: Publish the verified OCI image to GHCR
        required: true
        default: false
        type: boolean

permissions: {}

concurrency:
  group: manual-owner-beta-${{ inputs.expected_source_commit }}
  cancel-in-progress: false

jobs:
  build:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    env:
      APPROVED_SOURCE_COMMIT: 4d6bdbdbf33fe3ece3c53853fab9931882ff3f3c
      APPROVED_SOURCE_TAG: v2026.7.2-beta.6
      CANDIDATE_REPOSITORY: https://github.com/openclaw/openclaw.git
      CODEX_ARTIFACT_SHA256: 9336e6e0ad7697a94257253665b0f4e7fcfdc2af567610a549ace519d442b94b
      CODEX_ARTIFACT_URL: https://github.com/AshleyHollis/openclaw/releases/download/nas-v2026.7.1-2.6/openclaw-codex-2026.7.1-1-nas.6.tgz
      CODEX_VERSION: 2026.7.1-1
      DISCORD_TARBALL_SHA256: 28f1511de04906def70f7ff6950cd2d26f52be0ec93c5efce8f5c07cb46bc521
      DISCORD_TARBALL_URL: https://registry.npmjs.org/@openclaw/discord/-/discord-2026.7.1.tgz
      DISCORD_VERSION: 2026.7.1
      EXPECTED_VERSION: 2026.7.2-beta.6
      IMAGE_REPOSITORY: ghcr.io/ashleyhollis/openclaw
      QMD_ARTIFACT_SHA256: 4162fcc8812d44246065d121a339554419b55aeb4358fc61ca4acbda753bf28a
      QMD_ARTIFACT_URL: https://github.com/AshleyHollis/openclaw/releases/download/nas-v2026.7.1-2.6/openclaw-qmd-2.1.0-nas.6.tgz
      QMD_VERSION: 2.1.0
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Resolve and fetch the exact approved source
        id: source
        env:
          EXPECTED_SOURCE_COMMIT: ${{ inputs.expected_source_commit }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SOURCE_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          test "$EXPECTED_SOURCE_COMMIT" = "$APPROVED_SOURCE_COMMIT"
          tagged_commit="$(git ls-remote "$CANDIDATE_REPOSITORY" "refs/tags/$APPROVED_SOURCE_TAG^{}" | cut -f1)"
          test "$tagged_commit" = "$EXPECTED_SOURCE_COMMIT"
          git init --initial-branch=source candidate
          git -C candidate remote add origin "$CANDIDATE_REPOSITORY"
          git -C candidate fetch --depth=1 --no-tags origin "$EXPECTED_SOURCE_COMMIT"
          git -C candidate checkout --detach FETCH_HEAD
          test "$(git -C candidate rev-parse HEAD)" = "$EXPECTED_SOURCE_COMMIT"
          test "$(node -p "require('./candidate/package.json').version")" = "$EXPECTED_VERSION"
          git -C candidate archive --format=tar.gz --prefix=openclaw/ \
            --output "$RUNNER_TEMP/openclaw-source.tar.gz" "$EXPECTED_SOURCE_COMMIT"
          source_digest="sha256:$(sha256sum "$RUNNER_TEMP/openclaw-source.tar.gz" | cut -d ' ' -f1)"
          short_commit="${EXPECTED_SOURCE_COMMIT:0:8}"
          printf 'source_digest=%s\nimage_tag=manual-%s-%s\nlocal_image=openclaw-owner-beta:%s-%s\n' \
            "$source_digest" "$EXPECTED_VERSION" "$short_commit" "$EXPECTED_VERSION" "$short_commit" >> "$GITHUB_OUTPUT"

      - name: Fail-closed source secret scan
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GIT_DIR: ${{ github.workspace }}/candidate/.git
          GIT_WORK_TREE: ${{ github.workspace }}/candidate
          GITLEAKS_CONFIG: ${{ github.workspace }}/downstream/gitleaks-public-openclaw-beta6.toml
          GITLEAKS_ENABLE_SUMMARY: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22.23.1

      - name: Install without package lifecycle scripts
        working-directory: candidate
        run: |
          set -euo pipefail
          corepack enable
          corepack pnpm install --frozen-lockfile --ignore-scripts

      - name: Run focused Control UI and protocol checks
        working-directory: candidate
        run: |
          set -euo pipefail
          corepack pnpm --dir ui exec vitest run \
            src/api/gateway-browser-socket.test.ts \
            src/components/login-gate.test.ts \
            src/components/exec-approval.test.ts \
            src/components/terminal/terminal-file-upload.test.ts
          corepack pnpm exec vitest run \
            packages/gateway-protocol/src/schema/sessions-create.test.ts \
            packages/gateway-protocol/src/exec-approvals-validators.test.ts

      - name: Build and package the exact candidate
        id: package
        working-directory: candidate
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/image-context"
          node scripts/package-openclaw-for-docker.mjs \
            --allow-unreleased-changelog \
            --output-dir "$RUNNER_TEMP/image-context" \
            --output-name openclaw-current.tgz
          tar -xOf "$RUNNER_TEMP/image-context/openclaw-current.tgz" package/package.json \
            > "$RUNNER_TEMP/openclaw-package.json"
          test "$(node -p "require('$RUNNER_TEMP/openclaw-package.json').version")" = "$EXPECTED_VERSION"
          package_digest="$(sha256sum "$RUNNER_TEMP/image-context/openclaw-current.tgz" | cut -d ' ' -f1)"
          printf 'package_digest=%s\n' "$package_digest" >> "$GITHUB_OUTPUT"

      - name: Assemble the minimal trusted image context
        run: |
          set -euo pipefail
          context="$RUNNER_TEMP/image-context"
          curl --fail --location --proto '=https' --tlsv1.2 \
            "$CODEX_ARTIFACT_URL" --output "$context/codex-current.tgz"
          printf '%s  %s\n' "$CODEX_ARTIFACT_SHA256" "$context/codex-current.tgz" | sha256sum -c -
          curl --fail --location --proto '=https' --tlsv1.2 \
            "$QMD_ARTIFACT_URL" --output "$context/qmd-current.tgz"
          printf '%s  %s\n' "$QMD_ARTIFACT_SHA256" "$context/qmd-current.tgz" | sha256sum -c -
          mkdir -p "$context/downstream/scripts"
          cp downstream/Dockerfile.artifact "$context/downstream/Dockerfile.artifact"
          cp downstream/scripts/smoke-image-runtime.mjs "$context/downstream/scripts/smoke-image-runtime.mjs"

      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - name: Build the OCI image once with SBOM and provenance
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: ${{ runner.temp }}/image-context
          file: ${{ runner.temp }}/image-context/downstream/Dockerfile.artifact
          platforms: linux/amd64
          outputs: type=oci,dest=${{ runner.temp }}/openclaw-beta.oci.tar
          sbom: true
          provenance: mode=max
          build-args: |
            CODEX_TARBALL_SHA256=${{ env.CODEX_ARTIFACT_SHA256 }}
            CODEX_VERSION=${{ env.CODEX_VERSION }}
            DISCORD_TARBALL_SHA256=${{ env.DISCORD_TARBALL_SHA256 }}
            DISCORD_TARBALL_URL=${{ env.DISCORD_TARBALL_URL }}
            DISCORD_VERSION=${{ env.DISCORD_VERSION }}
            OPENCLAW_TARBALL_SHA256=${{ steps.package.outputs.package_digest }}
            OPENCLAW_SOURCE_COMMIT=${{ env.APPROVED_SOURCE_COMMIT }}
            OPENCLAW_VERSION=${{ env.EXPECTED_VERSION }}
            QMD_TARBALL_SHA256=${{ env.QMD_ARTIFACT_SHA256 }}
            QMD_VERSION=${{ env.QMD_VERSION }}

      - name: Load the exact OCI image for local checks
        env:
          LOCAL_IMAGE: ${{ steps.source.outputs.local_image }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install --yes --no-install-recommends skopeo
          skopeo copy "oci-archive:$RUNNER_TEMP/openclaw-beta.oci.tar" "docker-daemon:$LOCAL_IMAGE"

      - name: Network-disabled production image smoke
        env:
          LOCAL_IMAGE: ${{ steps.source.outputs.local_image }}
        run: |
          set -euo pipefail
          docker run --rm --network none \
            --volume "$RUNNER_TEMP/image-context/downstream/scripts/smoke-image-runtime.mjs:/tmp/smoke-image-runtime.mjs:ro" \
            --env EXPECTED_CODEX_VERSION="$CODEX_VERSION" \
            --env EXPECTED_DISCORD_VERSION="$DISCORD_VERSION" \
            --env EXPECTED_OPENCLAW_VERSION="$EXPECTED_VERSION" \
            --env EXPECTED_QMD_VERSION="$QMD_VERSION" \
            --entrypoint node "$LOCAL_IMAGE" /tmp/smoke-image-runtime.mjs

      - name: Scan fixable critical vulnerabilities
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ${{ steps.source.outputs.local_image }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL
          scanners: vuln

      - name: Publish the already-verified OCI image
        id: publish
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_TAG: ${{ steps.source.outputs.image_tag }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | skopeo login ghcr.io \
            --username "${{ github.repository_owner }}" --password-stdin
          destination="$IMAGE_REPOSITORY:$IMAGE_TAG"
          skopeo copy --all "oci-archive:$RUNNER_TEMP/openclaw-beta.oci.tar" "docker://$destination"
          digest="$(skopeo inspect "docker://$destination" --format '{{.Digest}}')"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          printf 'digest=%s\nimage=%s@%s\n' "$digest" "$IMAGE_REPOSITORY" "$digest" >> "$GITHUB_OUTPUT"

      - name: Record separate owner-override evidence
        if: inputs.publish
        env:
          IMAGE: ${{ steps.publish.outputs.image }}
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
          PACKAGE_DIGEST: sha256:${{ steps.package.outputs.package_digest }}
          SOURCE_DIGEST: ${{ steps.source.outputs.source_digest }}
        run: |
          set -euo pipefail
          node - "$RUNNER_TEMP/manual-beta-owner-override.json" <<'NODE'
          const fs = require("node:fs");
          const evidence = {
            schemaVersion: 1,
            ownerOverride: true,
            normalReleaseReceipt: false,
            sourceTag: process.env.APPROVED_SOURCE_TAG,
            sourceCommit: process.env.APPROVED_SOURCE_COMMIT,
            version: process.env.EXPECTED_VERSION,
            sourceBundleDigest: process.env.SOURCE_DIGEST,
            packageDigest: process.env.PACKAGE_DIGEST,
            image: process.env.IMAGE,
            imageDigest: process.env.IMAGE_DIGEST,
            sbom: true,
            provenance: true,
            focusedChecks: ["control-ui-unit", "gateway-browser-socket-unit", "login-gate-unit", "approval-component-unit", "terminal-file-upload-unit", "session-create-validator-unit", "exec-approval-validator-unit", "image-runtime-smoke", "critical-vulnerability-scan"],
          };
          fs.writeFileSync(process.argv[2], `${JSON.stringify(evidence, null, 2)}\n`);
          NODE

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: inputs.publish
        with:
          name: manual-beta-owner-override-${{ inputs.expected_source_commit }}
          path: ${{ runner.temp }}/manual-beta-owner-override.json
          if-no-files-found: error
          retention-days: 90

      - name: Report immutable owner-override image
        if: inputs.publish
        env:
          IMAGE: ${{ steps.publish.outputs.image }}
          SOURCE_DIGEST: ${{ steps.source.outputs.source_digest }}
        run: |
          {
            echo '### Manual owner beta image'
            echo
            echo "- Source commit: \`$APPROVED_SOURCE_COMMIT\`"
            echo "- Source bundle: \`$SOURCE_DIGEST\`"
            echo "- Image: \`$IMAGE\`"
            echo '- Normal release receipts: `not created`'
          } >> "$GITHUB_STEP_SUMMARY"
